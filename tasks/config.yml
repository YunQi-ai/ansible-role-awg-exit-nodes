# code: language=ansible

- name: Create AmneziaWG configuration directory
  ansible.builtin.file:
    path: '{{ awg_remote_directory }}'
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy AmneziaWG configuration
  notify:
    - Reload AWG
  vars:
    awg_addresses: "{{ [awg_network] }}" # | ansible.utils.ipaddr(0) | ansible.utils.ipaddr('address')
  ansible.builtin.template:
    src: awg.conf.j2
    dest: '{{ awg_remote_directory }}/{{ awg_interface }}.conf'
    owner: root
    group: root
    mode: '0600'
    backup: true

- name: Enable AmneziaWG service
  ansible.builtin.systemd:
    name: 'awg-quick@{{ awg_interface }}'
    enabled: true
    state: started
    daemon_reload: true
