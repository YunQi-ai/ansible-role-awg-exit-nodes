# code: language=ansible
---
- name: Check if config file exists
  ansible.builtin.stat:
    path: '{{ awg_remote_directory }}/{{ awg_interface }}.conf'
  register: _awg_config_file

- name: Read existing private key from config
  when: _awg_config_file.stat.exists
  block:
    - name: Get private key from existing config
      ansible.builtin.shell: |
        set -euo pipefail
        grep -E '^PrivateKey\s*=' {{ awg_remote_directory }}/{{ awg_interface }}.conf | sed 's/^PrivateKey\s*=\s*//' | tr -d ' '
      args:
        executable: /bin/bash
      register: _awg_existing_private_key
      changed_when: false

    - name: Set private key fact from existing config
      ansible.builtin.set_fact:
        awg_private_key: '{{ _awg_existing_private_key.stdout }}'
      when: _awg_existing_private_key.stdout | length > 0

- name: Generate new keypair
  when: >
    not _awg_config_file.stat.exists
    or awg_private_key is undefined
  block:
    - name: Generate new private key
      ansible.builtin.command:
        cmd: awg genkey
      register: _awg_generated_private_key
      changed_when: false

    - name: Set private key fact from generated key
      when: awg_private_key is not defined or awg_private_key | length == 0
      ansible.builtin.set_fact:
        awg_private_key: '{{ _awg_generated_private_key.stdout }}'

- name: Derive public key from private key
  ansible.builtin.shell: |
    set -euo pipefail
    echo -n '{{ awg_private_key }}' | awg pubkey
  args:
    executable: /bin/bash
  register: _awg_public_key
  changed_when: false

- name: Set public key fact for peer sharing
  when: awg_public_key is not defined
  ansible.builtin.set_fact:
    awg_public_key: '{{ _awg_public_key.stdout }}'
